name: Run Auto-Doc on README.md
on:
  push:
    branches:
     - 0.x
     - 1.x
    paths:
      - 'action.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Auto-Doc
        uses: tj-actions/auto-doc@v3.6.0
        with:
          output: 'readme.md'

      - name: Verify changed files
        uses: tj-actions/verify-changed-files@v20.0.4
        id: verify-changed-files
        with:
            files: |
              readme.md

      - name: Create pull request
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # GITHUB_TOKEN rather than GH_PAT, because sign-commits only signs when
          # the token is GITHUB_TOKEN (as github-actions[bot]) or a GitHub App
          # token. With a personal PAT the commit is attributed to the PAT owner
          # and left unsigned, which the org's required_signatures ruleset on 0.x
          # rejects -- so every auto-doc pull request needed its commit amending
          # by hand.
          #
          # The trade-off: GitHub does not start workflow runs for events raised
          # by GITHUB_TOKEN, so the checks required to merge may not run on the
          # pull request this opens. Closing and reopening it raises `reopened`
          # from a real account, which is in the default set of pull_request
          # activity types and does start them.
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          base: "0.x"
          title: "[auto-doc] Update README.md"
          branch: "chore/auto-doc-update-readme"
          commit-message: "[auto-doc] Update README.md"
          body: "This pull request updates the documentation to the latest action.yml."